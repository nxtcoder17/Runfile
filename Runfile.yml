tasks:
  build:
    cmd: 
      - |+
        echo "building ..."
        go build -o bin/run -ldflags="-s -w" -tags urfave_cli_no_docs ./cmd/run
        echo "DONE"

  build:dev:
    cmd: 
      - |+
        echo "building ..."
        go build -o bin/run-nightly -ldflags="-s -w" -tags urfave_cli_no_docs ./cmd/run
        echo "DONE"

  example:
    dir: ./examples
    cmd: 
      - echo "hello world"

  test:
    env:
      pattern:
        default: ""
      only_failing:
        default: false
    watch:
      dir:
        - ./parser
      onlySuffixes:
        - .go
    cmd:
      - |+
        pattern_args=""
        [ -n "$pattern" ] && pattern_args="-run $pattern"

        testfmt_args=""
        [ "$only_failing" = "true" ] && testfmt_args="--hide successful-tests"

        go test -json ./pkg/runfile/resolver/... $pattern_args | gotestfmt $testfmt_args
        go test -json ./pkg/executor/... $pattern_args | gotestfmt $testfmt_args

  test:only-failing:
    cmd:
      - go test -json ./pkg/runfile/resolver/... | gotestfmt --hide successful-tests
        go test -json ./pkg/executor/... $pattern_args | gotestfmt --hide successful-tests

